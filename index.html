<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Endless Cave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --amber: #e9c27a; --amber-dim: #a8875a; --good: #f6d35a; --bad: #ff7a5c; --warn: #ffb04a; --cmd: #9fd8c8;
    --panel: rgba(10, 7, 5, 0.82); --edge: #5a4630;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: 'VT323', ui-monospace, Menlo, Consolas, monospace; color: var(--amber); user-select: none; }
  canvas#gl { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 2px 2px 0 #000, 0 0 6px #000; }
  #hud.hidden { display: none; }

  #log { position: absolute; left: 14px; top: 10px; width: min(52ch, 46vw); max-height: 46vh; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end; font-size: 21px; line-height: 1.08; }
  #log .line { margin: 0 0 5px; animation: logfade 2s linear 30s forwards; white-space: pre-wrap; }
  #log .title { color: #fff1c8; font-size: 25px; margin-top: 4px; }
  #log .good { color: var(--good); } #log .bad { color: var(--bad); } #log .warn { color: var(--warn); }
  #log .cmd { color: var(--cmd); } #log .dim { color: var(--amber-dim); }
  #log.open { background: var(--panel); padding: 8px 10px; border: 2px solid var(--edge); max-height: 70vh; }
  #log.open .line { animation: none; opacity: 1; }
  @keyframes logfade { to { opacity: 0; } }

  #loc { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; }
  #locName { font-size: 28px; color: #fff1c8; }
  #locSub { font-size: 19px; color: var(--amber-dim); }
  #compass { position: absolute; top: 12px; right: 14px; width: 168px; text-align: center; font-size: 22px; }
  #minimap { position: absolute; top: 40px; right: 14px; width: 168px; height: 168px; border: 2px solid var(--edge); image-rendering: pixelated; }
  #inv { position: absolute; top: 218px; right: 14px; width: 210px; text-align: right; font-size: 19px; line-height: 1.05; }
  #inv .t { color: var(--good); }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: var(--amber); opacity: .7; }
  #prompt { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); font-size: 24px; color: #fff1c8; white-space: nowrap; }
  #status { position: absolute; left: 14px; bottom: 12px; font-size: 21px; }
  .bar { width: 190px; height: 12px; border: 2px solid var(--edge); background: #120c08; margin: 2px 0 6px; }
  .bar > div { height: 100%; }
  #hpFill { background: linear-gradient(#e25a3c, #8f2a18); }
  #fuelFill { background: linear-gradient(#ffd884, #c47c18); }
  #scorebox { position: absolute; right: 14px; bottom: 12px; text-align: right; font-size: 22px; }
  #console { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); width: min(720px, 90vw);
    display: none; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--edge); padding: 6px 10px; pointer-events: auto; }
  #console.open { display: flex; }
  #console span { font-size: 26px; color: var(--cmd); }
  #cmd { flex: 1; background: transparent; border: 0; outline: 0; color: #fff1c8; font: inherit; font-size: 26px; text-transform: uppercase; }

  #bigmap { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; image-rendering: pixelated; pointer-events: none; }
  #bigmap.open { display: block; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); padding: 16px; box-sizing: border-box; }
  #overlay.hidden { display: none; }
  .panel { background: var(--panel); border: 2px solid var(--edge); padding: 22px 30px; max-width: 760px; width: 100%; box-sizing: border-box;
    text-shadow: 2px 2px 0 #000; max-height: 92vh; overflow: auto; }
  .panel h1 { font-size: clamp(44px, 8vw, 78px); margin: 0; color: #ffcf6a; letter-spacing: 3px; line-height: .9; text-shadow: 4px 4px 0 #3a1a00; }
  .panel h2 { font-size: 34px; margin: 0 0 6px; color: #ffcf6a; }
  .panel p { font-size: 22px; line-height: 1.15; margin: 10px 0; }
  .panel .sub { color: var(--amber-dim); font-size: 22px; margin-top: 4px; }
  .keys { display: grid; grid-template-columns: max-content 1fr; gap: 1px 16px; font-size: 20px; margin: 12px 0; }
  .keys b { color: #fff1c8; font-weight: normal; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  button { font: inherit; font-size: 26px; background: #2a1c10; color: #ffdf9a; border: 2px solid #8a6838; padding: 4px 18px; cursor: pointer; }
  button:hover { background: #3e2a16; }
  button:disabled { opacity: .4; cursor: default; }
  .setting { display: flex; align-items: center; gap: 14px; font-size: 22px; margin: 6px 0 4px; flex-wrap: wrap; }
  .setting input[type=range] { flex: 1; min-width: 160px; accent-color: #c4892a; cursor: pointer; }
  .setting span { min-width: 4ch; color: #fff1c8; }
  input.seed { font: inherit; font-size: 22px; background: #120c08; color: #ffdf9a; border: 2px solid var(--edge); padding: 4px 8px; width: 140px; }
  @media (max-width: 700px) { #minimap, #inv, #compass { display: none; } #log { width: 90vw; font-size: 18px; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <div id="log"></div>
  <div id="loc"><div id="locName"></div><div id="locSub"></div></div>
  <div id="compass"></div>
  <canvas id="minimap" width="168" height="168"></canvas>
  <div id="inv"></div>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="status">
    <div>HEALTH <span id="lives"></span></div><div class="bar"><div id="hpFill"></div></div>
    <div>LAMP OIL <span id="lampState"></span></div><div class="bar"><div id="fuelFill"></div></div>
  </div>
  <div id="scorebox"></div>
  <div id="console"><span>&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" maxlength="80"></div>
</div>
<canvas id="bigmap"></canvas>
<div id="overlay"><div class="panel"><h2>Loading the cave...</h2></div></div>

<script src="js/util.js"></script>
<script src="js/textures.js"></script>
<script src="js/world.js"></script>
<script src="js/mesh.js"></script>
<script src="js/renderer.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
